<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Ambiente — LIM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

    <script>
        /* -----------------------------------------------------
           AUDIO HELPER
        ----------------------------------------------------- */
        function playSound(filename, { start = 0, end = 0, speed = 1 } = {}) {
            const id = "snd-" + filename.replace(/[^a-z0-9]/gi, "_");
            let audio = document.getElementById(id);
            if (!audio) {
                audio = document.createElement("audio");
                audio.id = id;
                audio.src = filename;
                audio.preload = "auto";
                document.body.appendChild(audio);
            }

            if (audio._stopTimer) {
                clearTimeout(audio._stopTimer);
                audio._stopTimer = null;
            }

            function doPlay() {
                try {
                    audio.currentTime = start;
                    audio.playbackRate = speed;
                } catch (e) {}
                
                const p = audio.play();
                if (p && p.catch) p.catch(() => {});

                if (end > start) {
                    const durationMs = ((end - start) / speed) * 1000;
                    audio._stopTimer = setTimeout(() => {
                        try { audio.pause(); } catch(e) {}
                    }, durationMs);
                }
            }

            if (audio.readyState >= 1) {
                doPlay();
            } else {
                audio.addEventListener("canplay", doPlay, { once: true });
            }
        }

        /* -----------------------------------------------------
           SIMPLE TELEPORT
        ----------------------------------------------------- */
        AFRAME.registerComponent("simple-teleport", {
            init() {
                this.marker = document.createElement("a-entity");
                this.marker.setAttribute("geometry", "primitive:ring; radiusInner:0.15; radiusOuter:0.2");
                this.marker.setAttribute("material", "color:#000; opacity:0.8; shader:flat");
                this.marker.setAttribute("rotation", "-90 0 0");
                this.marker.setAttribute("visible", false);
                this.el.sceneEl.appendChild(this.marker);

                this.isAiming = false;
                this.lastHit = null;

                this.el.addEventListener("axismove", e => {
                    const y = e.detail.axis?.[3] ?? e.detail.axis?.[1];
                    if (y < -0.7 && !this.isAiming) {
                        this.isAiming = true;
                        this.el.setAttribute("raycaster", "showLine:true");
                    } else if (y > -0.1 && this.isAiming) {
                        this.teleport();
                        this.isAiming = false;
                        this.el.setAttribute("raycaster", "showLine:false");
                        this.marker.setAttribute("visible", false);
                    }
                });
            },

            tick() {
                if (!this.isAiming) return;
                const ray = this.el.components.raycaster;
                if (!ray?.intersections?.length) return;

                const hit = ray.intersections.find(i =>
                    i.object.el.classList.contains("walkable")
                );
                if (!hit) return;

                this.lastHit = hit.point;
                this.marker.setAttribute("position", {
                    x: hit.point.x,
                    y: hit.point.y + 0.02,
                    z: hit.point.z
                });
                this.marker.setAttribute("visible", true);
            },

            teleport() {
                if (!this.lastHit) return;
                document.querySelector("#cameraRig").setAttribute("position", this.lastHit);
                playSound("move.mp3", { start: 0.2, end: 0, speed: 1 });
            }
        });

        /* -----------------------------------------------------
           DRAG
        ----------------------------------------------------- */
        AFRAME.registerComponent("arrastavel", {
            schema: { controllerId: { type: "string" } },

            init() {
                const ground = document.querySelector(".floor");
                this.groundY = ground?.getAttribute("position")?.y ?? 0;

                if (this.el.getAttribute("dynamic-body")) {
                    this.el.removeAttribute("dynamic-body");
                    this.hadPhysics = true;
                }
            },

            remove() {
                if (this.hadPhysics) {
                    // Restaurar como box para consistência e performance
                    this.el.setAttribute("dynamic-body", "shape: box; mass: 2");
                }
            },

            tick() {
                const ctrl = document.querySelector("#" + this.data.controllerId);
                if (!ctrl) return;

                const ctrlObj = ctrl.object3D;
                const pos = new THREE.Vector3();
                ctrlObj.getWorldPosition(pos);

                const quat = new THREE.Quaternion();
                ctrlObj.getWorldQuaternion(quat);

                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
                pos.add(forward.multiplyScalar(1.2));

                pos.y = Math.max(pos.y - 1, this.groundY + (this.el.dataset.bottomOffset ?? 0));
                pos.x -= 0.09;

                this.el.object3D.position.lerp(pos, 0.4);

                const gp = ctrl.components["tracked-controls"]?.controller?.gamepad;
                const ax = gp?.axes?.[2] ?? 0;
                this.el.object3D.rotation.y -= ax * 0.05;
            }
        });

        /* -----------------------------------------------------
           QUEST GRAB
        ----------------------------------------------------- */
        AFRAME.registerComponent("quest-grab", {
            init() {
                this.el.addEventListener("triggerdown", () => this.grab());
                this.el.addEventListener("triggerup", () => this.release());
            },

            grab() {
                const ray = this.el.components.raycaster;
                if (!ray?.intersections?.length) return;

                const target = ray.intersections[0].object.el;

                if (target.classList.contains("ui-button")) {
                    target.emit("click");
                    return;
                }

                if (!target.classList.contains("clickable")) return;

                this.held = target;
                target.setAttribute("arrastavel", { controllerId: this.el.id });
            },

            release() {
                if (!this.held) return;
                this.held.removeAttribute("arrastavel");
                this.held = null;
            }
        });

        /* -----------------------------------------------------
           SPAWNER
        ----------------------------------------------------- */
        AFRAME.registerComponent("spawner", {
            schema: { model: { type: "string" } },

            init() {
                this.canSpawn = true;
                this.el.addEventListener("click", () => {
                    if (!this.canSpawn) return;
                    
                    playSound("obj.mp3", { start: 0, end: 0, speed: 1 });
                    
                    this.canSpawn = false;
                    setTimeout(() => this.canSpawn = true, 1000);

                    const obj = document.createElement("a-entity");
                    obj.setAttribute("gltf-model", this.data.model);
                    obj.setAttribute("scale", "0.6 0.6 0.6");
                    obj.setAttribute("position", "0 0 -2");
                    obj.classList.add("clickable");

                    obj.addEventListener("model-loaded", () => {
                        const box = new THREE.Box3().setFromObject(obj.object3D);
                        obj.dataset.bottomOffset = -box.min.y;
                        obj.setAttribute("position", { x: 0, y: -box.min.y, z: -2 });
                        // Usando shape: box para evitar travamentos ao calcular colisão de malhas complexas (hull)
                        obj.setAttribute("dynamic-body", "shape: box; mass: 2");
                    });

                    document.querySelector("a-scene").appendChild(obj);
                });
            }
        });

        /* -----------------------------------------------------
           HUD AUTO BAR
        ----------------------------------------------------- */
        const HUD_MODELS = [
            { id: "chair", src: "chair.glb", scale: "0.10 0.10 0.10" },
            { id: "table", src: "table.glb", scale: "0.02 0.02 0.02" },
            { id: "bed", src: "bed.glb", scale: "0.10 0.10 0.10" }
        ];

        AFRAME.registerComponent("hud-bar", {
            init() {
                const spacing = 0.45;
                const startX = -((HUD_MODELS.length - 1) * spacing) / 2;

                HUD_MODELS.forEach((item, i) => {
                    const el = document.createElement("a-entity");
                    el.setAttribute("gltf-model", "#" + item.id);
                    el.setAttribute("scale", item.scale);
                    el.setAttribute("position", {
                        x: startX + i * spacing,
                        y: -0.07,
                        z: 0.01
                    });
                    el.classList.add("clickable", "ui-button");
                    el.setAttribute("spawner", "model:#" + item.id);
                    this.el.appendChild(el);
                });
            }
        });
    </script>
</head>

<body>
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    <a-scene embedded raycaster="objects:.clickable" physics="debug: false; gravity: -9.8">

        <a-assets>
            <a-asset-item id="chair" src="chair.glb"></a-asset-item>
            <a-asset-item id="table" src="table.glb"></a-asset-item>
            <a-asset-item id="bed" src="bed.glb"></a-asset-item>

            <img id="woodTex" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        </a-assets>

        <!-- FLOOR (BROWN-GRAY WOOD) -->
        <a-plane class="walkable floor" rotation="-90 0 0" width="20" height="20"
            material="src:#woodTex; repeat:6 6; color:#8A8175; roughness:0.9"
            static-body>
        </a-plane>

        <!-- WALLS -->
        <a-plane position="0 1.5 -10" width="20" height="3" color="#B3B3B3" static-body></a-plane>
        <a-plane position="0 1.5 10" rotation="0 180 0" width="20" height="3" color="#B3B3B3" static-body></a-plane>
        <a-plane position="-10 1.5 0" rotation="0 90 0" width="20" height="3" color="#AAAAAA" static-body></a-plane>
        <a-plane position="10 1.5 0" rotation="0 -90 0" width="20" height="3" color="#AAAAAA" static-body></a-plane>

        <!-- WINDOW WITH GRID -->
        <a-entity position="0 1.6 -9.98">
            <!-- glass -->
            <a-plane width="4" height="1.6" material="color:#BFE9FF; opacity:0.35; transparent:true"></a-plane>

            <!-- vertical bars -->
            <a-plane width="0.05" height="1.6" position="-1.33 0 0.01" color="#666"></a-plane>
            <a-plane width="0.05" height="1.6" position="0 0 0.01" color="#666"></a-plane>
            <a-plane width="0.05" height="1.6" position="1.33 0 0.01" color="#666"></a-plane>

            <!-- horizontal bars -->
            <a-plane width="4" height="0.05" position="0 0.53 0.01" color="#666"></a-plane>
            <a-plane width="4" height="0.05" position="0 -0.53 0.01" color="#666"></a-plane>
        </a-entity>

        <a-sky color="#87CEEB"></a-sky>

        <a-entity id="cameraRig">
            <a-entity camera position="0 1.6 0">

                <!-- HUD -->
                <a-entity position="0 -0.65 -1.3" geometry="primitive:plane; width:1.4; height:0.25"
                    material="color:black; opacity:0.35" hud-bar>
                </a-entity>

            </a-entity>

            <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.clickable" quest-grab></a-entity>

            <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.walkable; far:20"
                simple-teleport></a-entity>
        </a-entity>

    </a-scene>
</body>

</html>
