<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Drag by Controller (Quest) — With Z Movement (floor snap)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script>
    /* -----------------------------------------------------
        SIMPLE TELEPORT (Custom implementation)
    ----------------------------------------------------- */
    AFRAME.registerComponent("simple-teleport", {
        init: function () {
            this.marker = document.createElement("a-entity");
            this.marker.setAttribute("geometry", "primitive: ring; radiusInner: 0.15; radiusOuter: 0.2");
            this.marker.setAttribute("material", "color: #000; shader: flat; opacity: 0.8");
            this.marker.setAttribute("rotation", "-90 0 0");
            this.marker.setAttribute("visible", false);
            this.el.sceneEl.appendChild(this.marker);

            this.isAiming = false;
            this.lastHit = null;

            this.onAxisMove = this.onAxisMove.bind(this);
            this.el.addEventListener("axismove", this.onAxisMove);
        },

        onAxisMove: function (e) {
            const axis = e.detail.axis;
            if (!axis) return;

            const y = axis.length > 3 ? axis[3] : axis[1];
            
            if (y < -0.7 && !this.isAiming) {
                this.isAiming = true;
                this.el.setAttribute("raycaster", "showLine", true);
            } 
            else if (y > -0.1 && this.isAiming) {
                this.teleport();
                this.isAiming = false;
                this.el.setAttribute("raycaster", "showLine", false);
                this.marker.setAttribute("visible", false);
            }
        },

        tick: function () {
            if (!this.isAiming) return;

            const raycaster = this.el.components.raycaster;
            if (!raycaster) return;

            const intersections = raycaster.intersections;

            if (intersections && intersections.length > 0) {
                const hit = intersections.find(i => i.object.el.classList.contains("walkable"));
                if (hit) {
                    this.lastHit = hit.point;
                    this.marker.setAttribute("position", {
                        x: this.lastHit.x, 
                        y: this.lastHit.y + 0.02, 
                        z: this.lastHit.z
                    });
                    this.marker.setAttribute("visible", true);
                } else {
                    this.lastHit = null;
                    this.marker.setAttribute("visible", false);
                }
            } else {
                this.lastHit = null;
                this.marker.setAttribute("visible", false);
            }
        },

        teleport: function () {
            if (!this.lastHit) return;
            const rig = document.querySelector("#cameraRig");
            if (rig) {
                rig.setAttribute("position", {
                    x: this.lastHit.x,
                    y: this.lastHit.y,
                    z: this.lastHit.z
                });
            }
        }
    });

    /* -----------------------------------------------------
        DRAG COMPONENT — UPDATED WITH SENSOR FIX
    ----------------------------------------------------- */
    AFRAME.registerComponent("arrastavel", {
        schema: { controllerId: { type: "string", default: "" } },

        init: function () {
            this.controllerEl = null;
            this.groundY = 0;

            const ground = document.querySelector("a-plane");
            if (ground) {
                const pos = ground.getAttribute("position");
                this.groundY = (pos && typeof pos.y === "number") ? pos.y : (pos?.y ?? 0);
            }
        },

        update: function () {
            this.controllerEl = this.data.controllerId
                ? document.querySelector("#" + this.data.controllerId)
                : null;
        },

        tick: function () {
            if (!this.controllerEl) return;

            const rightCtrl = this.controllerEl;
            const obj = this.el.object3D;
            const ctrlObj = rightCtrl.object3D;

            if (!obj || !ctrlObj) return;

            // Get controller world position and rotation
            const ctrlPos = new THREE.Vector3();
            ctrlObj.getWorldPosition(ctrlPos);
            
            const ctrlQuat = new THREE.Quaternion();
            ctrlObj.getWorldQuaternion(ctrlQuat);

            const forward = new THREE.Vector3(0, 0, -1)
                .applyQuaternion(ctrlQuat)
                .normalize();

            // Base: object stays 1.2m in front of controller
            const finalPos = ctrlPos.clone().add(
                forward.clone().multiplyScalar(1.2)
            );

            // --- SENSOR FIX HERE ---
            // Subtract 2.0 from the Y position to compensate for the flawed sensor
            finalPos.y -= 1; 
            finalPos.x -= 0.15;
            // -----------------------

            // FLOOR CONSTRAINT
            // This ensures that even after subtracting 2, if it goes below ground, it snaps back up to the floor.
            const bottomOffset = parseFloat(this.el.dataset.bottomOffset || "0");
            finalPos.y = Math.max(finalPos.y, this.groundY + bottomOffset);

            // Smooth follow position
            obj.position.lerp(finalPos, 0.4);

            // Rotation logic (Stick)
            let ax = 0; 
            const tracked = rightCtrl.components["tracked-controls"];
            const gamepad = tracked?.controller?.gamepad;

            if (gamepad?.axes) {
                ax = gamepad.axes[2] ?? gamepad.axes[0] ?? 0; 
            }

            const rotSpeed = 0.05;
            obj.rotation.y -= ax * rotSpeed; 
        }
    });

    /* -----------------------------------------------------
        QUEST PICK-UP SYSTEM
    ----------------------------------------------------- */
    AFRAME.registerComponent("quest-grab", {
        init: function () {
            this.isHolding = false;
            this.heldObject = null;

            this.onPress = this.onPress.bind(this);
            this.onRelease = this.onRelease.bind(this);

            this.el.addEventListener("triggerdown", this.onPress);
            this.el.addEventListener("triggerup", this.onRelease);
            this.el.addEventListener("abuttondown", this.onPress);
            this.el.addEventListener("abuttonup", this.onRelease);
        },

        onPress: function () {
            if (this.isHolding) return;

            const raycaster = this.el.components.raycaster;
            if (!raycaster || !raycaster.intersections.length) return;

            const target = raycaster.intersections[0].object.el;
            if (!target) return;

            if (target.classList.contains("ui-button")) {
                target.emit("click");
                return;
            }

            if (!target.classList.contains("clickable")) return;

            this.isHolding = true;
            this.heldObject = target;

            target.setAttribute("arrastavel", { controllerId: this.el.id });
        },

        onRelease: function () {
            if (!this.isHolding) return;

            this.isHolding = false;

            if (this.heldObject) {
                this.heldObject.removeAttribute("arrastavel");
                
                const bottomOffset = parseFloat(this.heldObject.dataset.bottomOffset || "0");
                const ground = document.querySelector("a-plane");
                let gy = 0;
                if (ground) {
                    const pos = ground.getAttribute("position");
                    gy = (pos && typeof pos.y === "number") ? pos.y : (pos?.y ?? 0);
                }
                const curPos = this.heldObject.getAttribute("position");
                const newY = Math.max(curPos.y, gy + bottomOffset);
                this.heldObject.setAttribute("position", { x: curPos.x, y: newY, z: curPos.z });

                this.heldObject = null;
            }
        }
    });

    /* -----------------------------------------------------
        SPAWNER BUTTON
    ----------------------------------------------------- */
    AFRAME.registerComponent("spawner", {
        schema: { model: { type: "string" } },
        init: function () {
            this.el.addEventListener("click", () => {
                const scene = document.querySelector("a-scene");

                const obj = document.createElement("a-entity");
                obj.setAttribute("gltf-model", this.data.model);
                obj.setAttribute("position", "0 0 -2");
                obj.setAttribute("scale", "0.6 0.6 0.6");
                obj.classList.add("clickable", "spawned");

                obj.addEventListener("model-loaded", (ev) => {
                    try {
                        const threeObj = obj.object3D;
                        threeObj.updateMatrixWorld(true);
                        const bbox = new THREE.Box3().setFromObject(threeObj);
                        const minY = bbox.min.y; 

                        const worldOrigin = new THREE.Vector3();
                        threeObj.getWorldPosition(worldOrigin);
                        const originY = worldOrigin.y;

                        const bottomOffset = originY - minY;
                        obj.dataset.bottomOffset = bottomOffset.toString();

                        const ground = document.querySelector("a-plane");
                        let gy = 0;
                        if (ground) {
                            const pos = ground.getAttribute("position");
                            gy = (pos && typeof pos.y === "number") ? pos.y : (pos?.y ?? 0);
                        }

                        const curPos = obj.getAttribute("position");
                        const newY = gy + bottomOffset;
                        obj.setAttribute("position", { x: curPos.x, y: newY, z: curPos.z });
                    } catch (err) {
                        console.warn("Erro ao calcular bbox do modelo:", err);
                    }
                });

                scene.appendChild(obj);
            });
        }
    });
    </script>
</head>

<body>
    <a-scene embedded vr-mode-ui="enabled: true" raycaster="objects: .clickable" cursor="rayOrigin: mouse">

    <a-assets>
        <a-asset-item id="cadeira" src="chair.glb"></a-asset-item>
    </a-assets>

    <a-plane id="ground" class="walkable" width="20" height="20" rotation="-90 0 0" color="#6BC48C" position="0 0 0"></a-plane>
    <a-sky color="#D0D0D0"></a-sky>

    <a-entity id="cameraRig" position="0 0 2">
        <a-entity id="head" camera position="0 1.6 0" look-controls wasd-controls>
            <a-entity id="hud"
                    position="0 -0.7 -1.5"
                    geometry="primitive: plane; width: 2; height: 0.6"
                    material="color: black; opacity: 0.35">

                <a-entity id="spawn-btn"
                            gltf-model="#cadeira"
                            class="clickable ui-button"
                            scale="0.18 0.18 0.18"
                            position="-0.5 -0.15 0"
                            spawner="model: #cadeira">
                </a-entity>

            </a-entity>
        </a-entity>

        <a-entity id="rightHand"
                    laser-controls="hand: right"
                    raycaster="objects: .clickable"
                    quest-grab></a-entity>

        <a-entity id="leftHand"
                    laser-controls="hand: left"
                    raycaster="objects: .walkable; far: 20; showLine: false"
                    simple-teleport></a-entity>
    </a-entity>

    </a-scene>
</body>
</html>
